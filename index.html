<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Follow Yourself</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Follow Yourself">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tek sütunlu telefon uygulaması; açılışta logo ekranı, üstte başlık, altta sabit 5 sekmeli gezinme.
   Renkler kullanıcının paletinden: Thunder Lime #E5E12C, Midnight Slate #40494E, Silver Mist #D9D9D6, siyah, beyaz. */
:root{
  padding-top:env(safe-area-inset-top,0px);
  --lime:#E5E12C; --on-lime:#000000; --slate:#40494E; --mist:#D9D9D6;
  --bg:#F2F2F0; --surface:#FFFFFF; --ink:#000000; --muted:#40494E; --line:#D9D9D6; --field:#F2F2F0;
  --accent:#000000; --lime-soft:#F4F3B8; --nav:#000000; --nav-ink:#D9D9D6;
  --warn:#9A5208; --warn-soft:#FBEEDD; --good:#24703F;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1A1E21; --ink:#FFFFFF; --muted:#A3A9AC; --line:#40494E; --field:#0E1113;
  --accent:#E5E12C; --lime-soft:#2B2C0E; --nav:#111416; --nav-ink:#A3A9AC;
  --warn:#F0A85A; --warn-soft:#33261A; --good:#7FD39B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1A1E21; --ink:#FFFFFF; --muted:#A3A9AC; --line:#40494E; --field:#0E1113;
  --accent:#E5E12C; --lime-soft:#2B2C0E; --nav:#111416; --nav-ink:#A3A9AC;
  --warn:#F0A85A; --warn-soft:#33261A; --good:#7FD39B; color-scheme:dark}
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:4px 120px}
h1,h2,h3{font-family:var(--body);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700}
h2{font-size:18px;font-weight:700;line-height:1.3}
h3{font-size:15px;font-weight:600;line-height:1.35}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding-block:6px}
header.top .brand{height:22px;width:auto;display:block}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.busy{background:var(--warn)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:40px;padding:8px 14px;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.btn.danger{background:#C2352B;border-color:#C2352B;color:#fff;font-weight:600}
.big-btn{width:100%;min-height:52px;font-size:15px;border-radius:14px}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--on-lime);font-weight:600}
.btn.ghost{background:transparent}
.btn.icon{width:42px;height:42px;min-height:0;padding:0;display:grid;place-items:center;font-size:18px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav .mid{text-align:center;min-width:0}
.weeknav .mid b{font-size:16px;font-weight:700;display:block;line-height:1.3}
/* gün şeridi */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 1px;min-height:52px;text-align:center;line-height:1.15;position:relative;min-width:0}
.day b{display:block;font-size:13.5px;font-weight:700}
.day span{font-size:9.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.sel{border-color:var(--lime);background:var(--lime);color:var(--on-lime)}
.day.sel span{color:var(--on-lime);opacity:.75}
.day.today:not(.sel) b{text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
.day.done::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--good)}
.day.sel.done::after{background:var(--on-lime)}
/* hareket kartı */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.ex-head{display:flex;gap:10px;align-items:flex-start}
.ex-no{font-weight:700;font-size:13px;color:var(--on-lime);background:var(--lime);width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px}
.ex-head .t{flex:1;min-width:0}
.target{font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sets{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.sets .h{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.sets .sn{font-size:12.5px;color:var(--muted);width:42px}
.in{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:9px 12px;font-variant-numeric:tabular-nums;font-size:16px}
.in::placeholder{color:var(--muted);opacity:.6}
.in:focus{border-color:var(--lime);outline:none;box-shadow:0 0 0 2px var(--lime)}
textarea.in{font-size:14px;resize:vertical;min-height:38px}
.hint{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--lime-soft);color:var(--ink)}
.pill.up{background:var(--lime);color:var(--on-lime)}
a.vid{font-size:12.5px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:2px;text-underline-offset:3px;font-weight:600}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
details.card summary{cursor:pointer;font-weight:600}
details.card[open] summary{margin-bottom:8px}
.rules{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.rules dt{font-weight:600}
.rules dd{margin:0;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--lime)}
/* beslenme */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.meal.now{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.meal.eaten{opacity:.7}
.meal-time{font-weight:600;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal.now .meal-time::after{content:"Şimdi";margin-left:8px;font-size:10.5px;background:var(--lime);color:var(--on-lime);border-radius:999px;padding:1px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
ul.items{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.eat{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.eat input{width:20px;height:20px;accent-color:var(--lime)}
.water{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:30px;height:38px;border:1.5px solid var(--muted);border-radius:4px 4px 9px 9px;background:transparent;padding:0}
.glass.on{background:var(--lime);border-color:var(--lime)}
.warnbox{font-size:12.5px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:7px 11px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mgrid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
/* ölçü & foto */
.bodywrap{display:flex;flex-direction:column;gap:14px}
.figure{width:min(100%,230px);margin-inline:auto}
.figure svg{width:100%;height:auto;display:block}
.figure .sil{fill:var(--field);stroke:var(--muted);stroke-width:1.6}
.figure .det path{fill:none;stroke:var(--muted);stroke-width:1.1;opacity:.55}
.figure .mline{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.figure .mk circle{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.figure .mk text{font-size:11px;font-weight:700;fill:var(--ink);font-family:var(--body)}
.figure .mk.on circle{fill:var(--lime);stroke:var(--on-lime)}
.figure .mk.on text{fill:var(--on-lime)}
.figure .mk.cur circle{stroke-width:3}
.figure .mk{cursor:pointer}
.mlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.mrow{display:grid;grid-template-columns:20px minmax(0,1fr);grid-template-areas:"no nm" "in in";gap:6px 8px;align-items:center}
.mrow .unit{grid-area:in}
.mrow .nm{grid-area:nm}
.mrow .no{grid-area:no;width:20px;height:20px;border-radius:50%;border:1.4px solid var(--ink);display:grid;place-items:center;font-size:10px;font-weight:700}
.mrow.on .no{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.mrow .nm{font-size:12.5px;font-weight:500;line-height:1.2;white-space:nowrap}
.mrow .nm .d{display:inline;margin-left:6px;font-size:11px;font-weight:500}
.unit{position:relative}
.unit .in{padding-right:30px;padding-block:6px;min-height:40px}
.unit em{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--muted)}
.kilo-row{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.slot{aspect-ratio:3/4;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;font-size:12px;color:var(--muted);position:relative;overflow:hidden;background:var(--field);cursor:pointer}
.slot svg.ghost{height:62%;width:auto;opacity:.85}
.slot svg.ghost .sil{fill:var(--surface);stroke:var(--muted);stroke-width:2.2}
.slot svg.ghost .det path{fill:none;stroke:var(--muted);stroke-width:1.4;opacity:.5}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.slot .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;padding:3px}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot .del{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:26px;padding:0;z-index:2}
.gal-week{display:flex;flex-direction:column;gap:6px}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;cursor:zoom-in;display:block}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:50;padding:20px}
.lightbox img{max-height:88vh;max-width:100%;border-radius:10px}
/* grafik */
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--lime);opacity:.28}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--lime);stroke:var(--ink)}
.chart .br{fill:var(--slate);opacity:.55} .chart .br.cur{fill:var(--lime);opacity:1;stroke:var(--ink);stroke-width:1}
.cdrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 40px;gap:8px;align-items:center}
.cdrow .unit{position:relative} .cdrow .unit::after{content:"dk";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.cdrow .unit .in{padding-right:30px}
.cdsum{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.chart .vl{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--body)}
select.in{font-size:15px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:20px 12px;font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stat b{font-size:21px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
/* özet */
.hello{display:flex;flex-direction:column;gap:2px}
.hello .date{font-size:12.5px;color:var(--muted);font-weight:500}
.quote{background:var(--lime);color:var(--on-lime);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.quote .q{font-size:17px;font-weight:600;line-height:1.42;text-wrap:pretty;position:relative}
.quote .src{font-size:11.5px;font-weight:500;opacity:.75;position:relative}
.quote .mark{position:absolute;right:-6px;top:-34px;font-size:150px;font-weight:800;line-height:1;opacity:.12}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi .card{display:flex;flex-direction:column;gap:6px;min-width:0}
.big{font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:99px}
.wkdots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wkdots div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted)}
.wkdots i{width:100%;max-width:30px;aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:var(--ink)}
.wkdots i.done{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.wkdots i.rest{border-style:dashed}
.wkdots i.today{border-color:var(--ink)}
.todaycard{display:flex;align-items:center;justify-content:space-between;gap:10px}
.go{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 14px;white-space:nowrap}
/* gezinme */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--nav);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav.tabs .in-nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
nav.tabs button{border:0;background:transparent;padding:7px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--nav-ink);min-width:0}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--on-lime);background:var(--lime)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:12.5px;z-index:40;white-space:nowrap}
/* hafta başlığı ve geçmiş */
.weekhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.weekhead b{display:block;font-size:22px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.weekhead .label{display:inline-flex;align-items:center;gap:6px}
.weekhead:not(.past) .label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 2px var(--ink)}
.wk-range{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.pastbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:12.5px;font-weight:500}
.pastbar .btn{white-space:nowrap;flex:none}
.hist summary{display:flex;align-items:center;gap:6px}
.hist-list{display:flex;flex-direction:column}
.hist-item{display:grid;grid-template-columns:1fr auto 16px;gap:10px;align-items:center;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 2px;font-size:13.5px}
.hist-item span{color:var(--muted);font-size:12.5px}
.hist-item.on b{text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
/* antrenman oturumu */
.session{display:flex;flex-direction:column;gap:12px}
.session.on{background:var(--lime-soft);border:1px solid var(--lime);border-radius:var(--r);padding:14px 16px}
.sess-res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sess-res>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.sess-res b{font-size:18px;font-weight:700}
.live{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:12px;background:var(--lime);color:var(--on-lime);border-radius:16px;padding:10px 10px 10px 16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.live .lt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.live .lt b{font-size:22px;font-weight:700;letter-spacing:-.01em}
.live .lt span{font-size:12px;font-weight:500;opacity:.8}
.live .btn{background:#000;border-color:#000;color:#fff}
.live .btn.danger{background:#C2352B;border-color:#C2352B}
.rec{width:10px;height:10px;border-radius:50%;background:#000;flex:none}
@media (prefers-reduced-motion: no-preference){.rec{animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.25}}}
.restrow{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.rbtn{min-height:40px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.rbtn:active{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.restov{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;padding-inline:12px;display:flex;justify-content:center}

const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const monday = s => { const d=parse(s); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return iso(d); };
let TODAY = iso(new Date());
const AY = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const fmt = s => { const d=parse(s); return d.getDate()+" "+AY[d.getMonth()]; };

const progWeek = w => Math.round((parse(w)-parse(monday(state.settings.start||TODAY)))/864e5/7)+1;

const state = { logs:{}, body:{}, daily:{}, settings:{}, photoUrls:{} };
let idb=null;
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open("form-defteri",1);
  r.onupgradeneeded=()=>{ r.result.createObjectStore("kv"); r.result.createObjectStore("photos"); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function tx(store,mode,fn){ return new Promise((res,rej)=>{ const t=idb.transaction(store,mode); const s=t.objectStore(store); const out=fn(s);
  t.oncomplete=()=>res(out&&out.result); t.onerror=()=>rej(t.error); }); }
const dataObj = () => ({logs:state.logs,body:state.body,daily:state.daily,settings:state.settings});
let saveT=null;
function save(){ clearTimeout(saveT); setSync("busy","Kaydediliyor…"); saveT=setTimeout(async()=>{
  try{ await tx("kv","readwrite",s=>s.put(JSON.parse(JSON.stringify(dataObj())),"data")); setSync("ok","Telefonda kayıtlı"); }
  catch(e){ setSync("","Kaydedilemedi"); toast("Kaydedilemedi: telefonda yer kalmamış olabilir."); } },400); }
function setSync(cls,txt){ const d=document.getElementById("syncdot"); d.className="dot "+cls; document.getElementById("synctxt").textContent=txt; }
async function loadAll(){
  idb=await idbOpen();
  const d=await tx("kv","readonly",s=>s.get("data"));
  if(d) for(const k of ["logs","body","daily","settings"]) if(d[k]) state[k]=d[k];
  const ids=[]; for(const w in state.body) for(const k in (state.body[w].photos||{})) ids.push(state.body[w].photos[k].pid);
  for(const id of ids){ if(!id) continue; const b=await tx("photos","readonly",s=>s.get(id)); if(b) state.photoUrls[id]=URL.createObjectURL(b); }
  try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
}
const photoSrc = p => state.photoUrls[p.pid] || "";
async function addPhoto(k,file){
  const w=ui.bodyWeek; toast("Fotoğraf kaydediliyor…");
  try{
    const {blob}=await shrink(file,1600,.85); const pid="p"+Date.now()+Math.random().toString(36).slice(2,7);
    await tx("photos","readwrite",s=>s.put(blob,pid)); state.photoUrls[pid]=URL.createObjectURL(blob);
    const b=(state.body[w] ||= {}); const old=(b.photos ||= {})[k]; b.photos[k]={pid,t:Date.now()};
    if(old&&old.pid) tx("photos","readwrite",s=>s.delete(old.pid)).catch(()=>{});
    save(); render(); toast("Fotoğraf kaydedildi");
  }catch(e){ toast("Fotoğraf kaydedilemedi."); }
}
function blobToData(b){ return new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); }); }
async function exportBackup(){
  toast("Yedek hazırlanıyor…");

  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Haftalık kardiyo dakikaları">${g}</svg></div>`;
}

// Noktalardan yumuşak (Catmull-Rom) kapalı eğri üretir.
function smooth(pts){

async function shrink(file,max,q){
  const url=URL.createObjectURL(file); const img=new Image(); img.src=url; await img.decode();
  const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
  c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  return new Promise(r=>c.toBlob(b=>r({blob:b,data:c.toDataURL("image/jpeg",q)}),"image/jpeg",q));
}

function lineChart(pts,unit,cls=""){
  if(pts.length<1) return "";
  const W=340,H=180,L=36,R=14,T=18,B=26, ys=pts.map(p=>p.y);
  let lo=Math.min(...ys), hi=Math.max(...ys); if(lo===hi){ lo-=1; hi+=1; } const padv=(hi-lo)*.15; lo-=padv; hi+=padv;
  const step=niceStep((hi-lo)/4); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const X=i=> pts.length===1 ? (L+W-R)/2 : L+i*(W-L-R)/(pts.length-1), Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let g=""; for(let v=lo; v<=hi+1e-9; v+=step){ g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L-6}" y="${Y(v)+3}" text-anchor="end">${fmtN(v)}</text>`; }
  const every=Math.ceil(pts.length/6);
  pts.forEach((p,i)=>{ if(i%every===0||i===pts.length-1) g+=`<text class="axis" x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(p.x)}</text>`; });
  const d=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area= pts.length>1? `<path class="ar" d="${d} L${X(pts.length-1)} ${H-B} L${X(0)} ${H-B} Z"/>`:"";
  const last=pts[pts.length-1];
  return `<div class="chart ${cls}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik">${g}${area}<path class="ln" d="${d}"/>
   ${pts.map((p,i)=>`<circle class="pt ${i===pts.length-1?"last":""}" cx="${X(i)}" cy="${Y(p.y)}" r="3.5"><title>${esc(p.x)}: ${fmtN(p.y)} ${unit}</title></circle>`).join("")}
   <text class="vl" x="${Math.min(X(pts.length-1),W-R)}" y="${Y(last.y)-9}" text-anchor="${pts.length>1?"end":"middle"}">${fmtN(last.y)} ${unit}</text></svg></div>`;
}
const niceStep = s => { const p=Math.pow(10,Math.floor(Math.log10(s))); const n=s/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; };
const fmtN = v => String(Math.round(v*10)/10).replace(".",",");
function allExercises(){ const m=new Map(); daysFor(monday(TODAY)).forEach(d=>d.ex.forEach(x=>{ if(!m.has(x.id)) m.set(x.id,{...x,days:[d.s]}); else m.get(x.id).days.push(d.s); })); return [...m.values()]; }
function exSeries(id){
  return Object.keys(state.logs).sort().map(w=>{ let best=null, top=null;
    for(const [k,e] of Object.entries(state.logs[w].entries||{})){ if(k.split("_").slice(1).join("_")!==id) continue;
      (e.sets||[]).forEach(s=>{ const kg=num(s&&s.kg); if(kg!=null&&(best==null||kg>best)){ best=kg; top=s; } }); }
    return best==null?null:{w,x:"H"+progWeek(w),y:best,r:top.r}; }).filter(Boolean);
}
function renderProgress(){
  const exs=allExercises(), sel=exs.find(x=>x.id===ui.exSel)||exs[0], ser=exSeries(sel.id);
  const weeks=Object.keys(state.logs).sort(), cw=monday(TODAY);
  const doneThis=Object.values(state.logs[cw]?.done||{}).filter(Boolean).length;
  const totalDone=weeks.reduce((a,w)=>a+Object.values(state.logs[w].done||{}).filter(Boolean).length,0);
  const bw=Object.keys(state.body).filter(w=>num(state.body[w].kilo)!=null).sort();
  const kDelta= bw.length>1 ? num(state.body[bw[bw.length-1]].kilo)-num(state.body[bw[0]].kilo) : null;
  let h=`<div class="stack"><div class="stats">
   <div class="stat"><span class="label">Bu hafta</span><b>${doneThis}/5</b><span class="small muted">antrenman</span></div>
   <div class="stat"><span class="label">Toplam</span><b>${totalDone}</b><span class="small muted">antrenman</span></div>
   <div class="stat"><span class="label">Kilo farkı</span><b>${kDelta==null?"–":(kDelta>0?"+":"")+fmtN(kDelta)}</b><span class="small muted">${kDelta==null?"2 ölçüm gerekli":"kg, ilk ölçümden"}</span></div></div>
   <div class="card stack"><div class="row between"><h3>Hareket gelişimi</h3><span class="hint">Haftanın en yüksek ağırlığı</span></div>
   <select class="in" id="ex-sel" data-act="exsel">${exs.map(x=>`<option value="${x.id}" ${x.id===sel.id?"selected":""}>${esc(x.n)} (${x.days.join(", ")})</option>`).join("")}</select>`;
  if(!ser.length) h+=`<div class="empty">${esc(sel.n)} için henüz kayıt yok. Antrenman sekmesinde ağırlıklarını girdikçe grafik burada oluşur.</div>`;
  else { h+=lineChart(ser,"kg");
    const first=ser[0].y, last=ser[ser.length-1].y;
    h+=`<div class="row between small"><span class="muted">${ser.length} hafta kayıt</span><b class="num" style="color:var(${last>=first?"--good":"--warn"})">${last-first>=0?"+":""}${fmtN(last-first)} kg</b></div>
    <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Hafta</th><th>Tarih</th><th>En yüksek</th><th>Tekrar</th></tr></thead><tbody>
    ${ser.slice().reverse().map(p=>`<tr><td>${p.x}</td><td>${fmt(p.w)}</td><td>${fmtN(p.y)} kg</td><td>${esc(p.r||"–")}</td></tr>`).join("")}</tbody></table></div>`; }
  h+=`</div>${cardioProgress()}<div class="card stack"><div class="row between"><h3>Beden ölçüleri</h3></div>
   <div class="chips">${METRICS.map(([k,n])=>`<button class="chip ${k===ui.metSel?"on":""}" data-act="metsel" data-k="${k}">${n}</button>`).join("")}</div>`;
  const [mk,mn,mu]=METRICS.find(m=>m[0]===ui.metSel);
  const ms=Object.keys(state.body).sort().filter(w=>num(state.body[w][mk])!=null).map(w=>({w,x:"H"+progWeek(w),y:num(state.body[w][mk])}));
  h+= ms.length? lineChart(ms,mu,"food") : `<div class="empty">${mn} ölçüsü girdiğinde değişim grafiği burada görünür.</div>`;
  return h+"</div></div>";
}

/* ===================== ANTRENMAN SAYACI & DİNLENME ===================== */
const hms = s => { s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":"+pad(m):m)+":"+pad(x); };
const mins = s => Math.max(1,Math.round(s/60));
let wakeLock=null, audioCtx=null, beepNodes=[], restT=null, liveT=null, finishArm=null;
const active = () => state.settings.active || null;
async function keepAwake(on){ try{ if(on&&"wakeLock" in navigator){ wakeLock=await navigator.wakeLock.request("screen"); } else if(!on&&wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){} }
function startSession(w,dk){
  if(active()) return;
  state.settings.active={w,dk,start:Date.now(),rest:0}; save(); keepAwake(true); unlockAudio();
  toast("Antrenman başladı, sayaç çalışıyor"); renderLive(); render();
}
function finishSession(){
  const a=active(); if(!a) return;
  if(finishArm==null){ finishArm=setTimeout(()=>{ finishArm=null; renderLive(); },3000); renderLive(); return; }
  clearTimeout(finishArm); finishArm=null; stopRest(false);
  const sec=(Date.now()-a.start)/1000, doc=weekDoc(a.w);
  (doc.sess ||= {})[a.dk]={start:a.start,end:Date.now(),sec:Math.round(sec),rest:Math.round(a.rest||0)};
  (doc.done ||= {})[a.dk]=true; state.settings.active=null; save(); keepAwake(false);
  toast(`Antrenman bitti: ${mins(sec)} dk, ${mins(a.rest||0)} dk dinlenme`); renderLive(); render();
}
function renderLive(){
  const el=document.getElementById("live"), a=active();
  clearInterval(liveT);
  if(!a){ el.hidden=true; return; }
  const d=daysFor(a.w).find(x=>x.id===a.dk);
  el.hidden=false;
  el.innerHTML=`<span class="rec" aria-hidden="true"></span><div class="lt"><b class="num" id="live-t">${hms((Date.now()-a.start)/1000)}</b><span>${d?d.n+" · "+d.type:"Antrenman"}</span></div>
   <button class="btn ${finishArm?"danger":"dark"}" data-live="finish">${finishArm?"Emin misin? Bitir":"Antrenmanı bitir"}</button>`;
  liveT=setInterval(()=>{ const t=document.getElementById("live-t"); if(t) t.textContent=hms((Date.now()-active().start)/1000); },1000);
}
document.getElementById("live").addEventListener("click",e=>{ if(e.target.closest("[data-live=finish]")) finishSession(); });

function unlockAudio(){ try{ audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
function scheduleBeep(inSec){
  cancelBeep(); if(!audioCtx) return;
  const t0=audioCtx.currentTime+Math.max(0,inSec);
  [0,.28,.56].forEach((o,i)=>{ const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
    osc.type="sine"; osc.frequency.value=i===2?1320:880; g.gain.setValueAtTime(0,t0+o); g.gain.linearRampToValueAtTime(.35,t0+o+.02); g.gain.linearRampToValueAtTime(0,t0+o+(i===2?.45:.2));
    osc.connect(g).connect(audioCtx.destination); osc.start(t0+o); osc.stop(t0+o+.5); beepNodes.push(osc); });
}
function cancelBeep(){ beepNodes.forEach(n=>{ try{ n.stop(); }catch(e){} }); beepNodes=[]; }
let rest=null; // {end,total,label,began}
function startRest(sec,label){
  unlockAudio(); if(rest) addRestTime();
  rest={end:Date.now()+sec*1000,total:sec,label,began:Date.now()}; scheduleBeep(sec); drawRest(); clearInterval(restT); restT=setInterval(tickRest,200);
}
function addRestTime(){ const a=active(); if(a&&rest){ a.rest=(a.rest||0)+Math.min(rest.total,(Date.now()-rest.began)/1000); save(); } }
function stopRest(count=true){ if(!rest) return; if(count) addRestTime(); cancelBeep(); clearInterval(restT); rest=null; const el=document.getElementById("rest"); el.classList.remove("fin"); el.hidden=true; }
function tickRest(){
  if(!rest) return; const left=(rest.end-Date.now())/1000;
  if(left<=0){ clearInterval(restT); addRestTime(); const el=document.getElementById("rest"); el.classList.add("fin");
    document.getElementById("rest-t").textContent="0:00"; document.getElementById("rest-l").textContent="Dinlenme bitti, sıradaki sete!";
    document.getElementById("rest-ring").style.strokeDashoffset=0;
    try{ navigator.vibrate&&navigator.vibrate([250,120,250]); }catch(e){}
    rest=null; setTimeout(()=>{ if(!rest){ el.classList.remove("fin"); el.hidden=true; } },1800); return; }
  document.getElementById("rest-t").textContent=hms(left);
  document.getElementById("rest-ring").style.strokeDashoffset=(1-left/rest.total)*RING;
}
const RING=2*Math.PI*44;
function drawRest(){
  const el=document.getElementById("rest"); el.hidden=false; el.classList.remove("fin");
  el.innerHTML=`<div class="rest-card" role="timer" aria-live="off"><svg viewBox="0 0 100 100" class="ring" aria-hidden="true"><circle cx="50" cy="50" r="44" class="trk"/><circle cx="50" cy="50" r="44" class="prg" id="rest-ring" style="stroke-dasharray:${RING};stroke-dashoffset:0"/></svg>
   <div class="rest-info"><span class="label">Dinlenme</span><b class="num" id="rest-t">${hms(rest.total)}</b><span class="small" id="rest-l">${esc(rest.label)}</span></div>
   <div class="rest-btns"><button class="btn" data-rest="plus">+15 sn</button><button class="btn dark" data-rest="skip">Geç</button></div></div>`;
}
document.getElementById("rest").addEventListener("click",e=>{ const b=e.target.closest("[data-rest]"); if(!b||!rest) return;
  if(b.dataset.rest==="plus"){ rest.end+=15000; rest.total+=15; scheduleBeep((rest.end-Date.now())/1000); tickRest(); }
  else stopRest(); });

/* ===================== ÇİZİM & OLAYLAR ===================== */
const TITLES={home:"Özet",train:"Antrenman",food:"Beslenme",progress:"Gelişim",body:"Vücut"};
function render(){
  const v=document.getElementById("view"), y=window.scrollY;
  document.getElementById("ttl").textContent=TITLES[ui.tab];
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===ui.tab));
  const a=document.activeElement, aid=a&&a.id, sel=a&&a.selectionStart;
  v.innerHTML = ui.tab==="home"?renderHome(): ui.tab==="train"?renderTrain(): ui.tab==="food"?renderFood(): ui.tab==="progress"?renderProgress(): renderBody();
  if(aid){ const n=document.getElementById(aid); if(n){ n.focus({preventScroll:true}); try{ if(sel!=null) n.setSelectionRange(sel,sel); }catch(e){} } }
  window.scrollTo(0,y);
}
document.querySelector("nav.tabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-tab]"); if(!b) return;
  ui.tab=b.dataset.tab; render(); window.scrollTo(0,0); });
const view=document.getElementById("view");
view.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return; const a=t.dataset.act;
  if(a==="wk"){ ui.week=t.dataset.w; ui.dayIdx= ui.week===monday(TODAY)?(parse(TODAY).getDay()+6)%7:0; render(); window.scrollTo(0,0); }
  else if(a==="day"){ ui.dayIdx=+t.dataset.i; render(); }
  else if(a==="copy"){ const p=prevEntry(t.dataset.w,t.dataset.k,t.dataset.id); if(!p) return; const en=entry(t.dataset.w,t.dataset.k,t.dataset.id);
    p.e.sets.forEach((s,i)=>{ en.sets[i] ||= {}; if(s&&s.kg&&!en.sets[i].kg) en.sets[i].kg=s.kg; }); save(); render(); }
  else if(a==="fd"){ ui.foodDate=addDays(ui.foodDate,+t.dataset.d); render(); }
  else if(a==="water"){ const d=dayDoc(ui.foodDate), i=+t.dataset.i; d.water = (d.water===i+1)? i : i+1; save(); render(); }
  else if(a==="opt"){ const d=dayDoc(ui.foodDate); (d.meals[t.dataset.m] ||= {}).opt=+t.dataset.i; save(); render(); }
  else if(a==="bw"){ ui.bodyWeek=t.dataset.w; state.pendingDel=null; render(); window.scrollTo(0,0); }
  else if(a==="pdel"){ e.preventDefault(); state.pendingDel=t.dataset.k; render(); }
  else if(a==="pdelno"){ state.pendingDel=null; render(); }
  else if(a==="pdelyes"){ const b=state.body[ui.bodyWeek], k=state.pendingDel, p=b?.photos?.[k];
    if(p){ delete b.photos[k]; save(); if(p.pid) tx("photos","readwrite",st=>st.delete(p.pid)).catch(()=>{}); }
    state.pendingDel=null; render(); toast("Fotoğraf silindi"); }
  else if(a==="zoom"){ const lb=document.createElement("div"); lb.className="lightbox"; lb.innerHTML=`<img src="${t.getAttribute("src")}" alt="">`; lb.onclick=()=>lb.remove(); document.body.appendChild(lb); }
  else if(a==="metsel"){ ui.metSel=t.dataset.k; render(); }
  else if(a==="startsess"){ startSession(t.dataset.w,t.dataset.k); }
  else if(a==="rest"){ startRest(+t.dataset.s,t.dataset.n); }
  else if(a==="gotrain"){ ui.tab="train"; ui.week=monday(TODAY); ui.dayIdx=(parse(TODAY).getDay()+6)%7; const td=daysFor(ui.week)[ui.dayIdx]; if((td.ex.length||td.wod)&&!active()) startSession(ui.week,td.id); else render(); window.scrollTo(0,0); }
  else if(a==="gobody"){ ui.tab="body"; ui.bodyWeek=monday(TODAY); render(); window.scrollTo(0,0); }
  else if(a==="gofood"){ ui.tab="food"; ui.foodDate=TODAY; render(); window.scrollTo(0,0); }
  else if(a==="mfocus"){ const n=document.getElementById("m-"+ui.bodyWeek+"-"+t.dataset.k); if(n){ n.focus(); n.scrollIntoView({block:"center",behavior:"smooth"}); } }
  else if(a==="backup"){ exportBackup(); }
  else if(a==="cdadd"){ const d=dayDoc(t.dataset.d); (d.cardio ||= []).push({m:t.dataset.m,min:""}); save(); render();
    const i=d.cardio.length-1, n=document.getElementById(`cd-${t.dataset.d}-${i}-${t.dataset.m?"min":"m"}`); if(n) n.focus(); }
  else if(a==="cddel"){ const d=dayDoc(t.dataset.d); d.cardio.splice(+t.dataset.i,1); save(); render(); }
});
view.addEventListener("input",e=>{
  const t=e.target, a=t.dataset.act; if(!a) return;
  if(a==="set"){ const en=entry(t.dataset.w,t.dataset.k,t.dataset.id); const i=+t.dataset.i; (en.sets[i] ||= {})[t.dataset.f]=t.value.trim(); save(); }
  else if(a==="note"){ entry(t.dataset.w,t.dataset.k,t.dataset.id).note=t.value; save(); }
  else if(a==="met"){ (state.body[ui.bodyWeek] ||= {})[t.dataset.k]=t.value.trim(); save();
    const on=num(t.value)!=null; t.closest(".mrow")?.classList.toggle("on",on); view.querySelector(`.mk[data-k="${t.dataset.k}"]`)?.classList.toggle("on",on); }
  else if(a==="cardio"){ const d=dayDoc(t.dataset.d); ((d.cardio ||= [])[+t.dataset.i] ||= {})[t.dataset.f]=t.value.trim(); save(); }
  else if(a==="wod" && t.tagName==="INPUT"){ const day=daysFor(ui.week)[ui.dayIdx]; entry(ui.week,day.id,"wod").res=t.value.trim(); save(); }
});
view.addEventListener("change",e=>{
  const t=e.target, a=t.dataset.act; if(!a) return;
  if(a==="done"){ const d=weekDoc(ui.week); (d.done ||= {})[t.dataset.k]=t.checked; save(); render(); if(t.checked) toast("Harika, antrenman işaretlendi"); }
  else if(a==="eat"){ const d=dayDoc(ui.foodDate); (d.meals[t.dataset.m] ||= {}).eaten=t.checked; if(d.meals[t.dataset.m].opt==null) d.meals[t.dataset.m].opt=0; save(); render(); }
  else if(a==="start"){ if(t.value){ state.settings.start=t.value; save(); render(); } }
  else if(a==="exsel"){ ui.exSel=t.value; render(); }
  else if(a==="wod" && t.tagName==="SELECT"){ const day=daysFor(ui.week)[ui.dayIdx]; entry(ui.week,day.id,"wod").alt=!!t.value; save(); }
  else if(a==="photo" && t.files&&t.files[0]){ addPhoto(t.dataset.k,t.files[0]); }
  else if(a==="restore" && t.files&&t.files[0]){ importBackup(t.files[0]); }
});

render();
const splashStart=Date.now();
function hideSplash(){ const sp=document.getElementById("splash"); if(!sp||sp.dataset.closing) return; sp.dataset.closing="1";
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches, wait=Math.max(0,(reduce?500:1500)-(Date.now()-splashStart));
  setTimeout(()=>{ sp.classList.add("out"); setTimeout(()=>sp.remove(),500); },wait); }
setTimeout(hideSplash,4000);
loadAll().finally(hideSplash).then(()=>{ if(!state.settings.start){ state.settings.start=monday(TODAY); save(); } setSync("ok","Telefonda kayıtlı"); render(); renderLive(); if(active()) keepAwake(true); })
  .catch(()=>{ setSync("","Kayıt açılamadı"); toast("Bu tarayıcı kayıt tutmaya izin vermiyor (gizli sekme olabilir)."); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
